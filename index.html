<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Report - Javier Pardo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        
        .slide {
            display: none;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            animation: fadeIn 0.4s ease-in-out;
        }

        .slide.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .nav-left, .nav-right {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            cursor: pointer;
            z-index: 10;
        }
        .nav-left { left: 0; }
        .nav-right { right: 0; }

        .counter {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.5);
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Rutas ajustadas a la estructura de GitHub Pages -->
    <img src="https://datapardo.github.io/news-report-ai/s1.png" class="slide active" alt="Slide 1">
    <img src="https://datapardo.github.io/news-report-ai/s2.png" class="slide" alt="Slide 2">
    <img src="https://datapardo.github.io/news-report-ai/s3.png" class="slide" alt="Slide 3">
    <img src="https://datapardo.github.io/news-report-ai/s4.png" class="slide" alt="Slide 4">
    <img src="https://datapardo.github.io/news-report-ai/s5.png" class="slide" alt="Slide 5">


<div class="nav-left" onclick="changeSlide(-1)"></div>
    <div class="nav-right" onclick="changeSlide(1)"></div>
    
    <!-- El ID cambió a counter-text para manejar todo desde JavaScript -->
    <div class="counter" id="counter-text"></div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const counter = document.getElementById('counter-text');

        // Inicializa el contador automáticamente contando las etiquetas <img>
        counter.innerText = `1 / ${slides.length}`;

        function changeSlide(direction) {
            slides[currentSlide].classList.remove('active');
            currentSlide += direction;
            
            // Lógica para que el carrusel sea infinito
            if (currentSlide >= slides.length) currentSlide = 0;
            if (currentSlide < 0) currentSlide = slides.length - 1;
            
            slides[currentSlide].classList.add('active');
            
            // Actualiza el texto con el número de diapositiva actual y el total
            counter.innerText = `${currentSlide + 1} / ${slides.length}`;
        }

        // Permitir pasar las diapositivas con las flechas del teclado o la barra espaciadora
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') changeSlide(1);
            if (e.key === 'ArrowLeft') changeSlide(-1);
        });
    </script>
</body>
</html>
